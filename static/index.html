<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Beautiful Task Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">✦</div>
                <h1>TaskFlow</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost" id="filterBtn">
                    <span class="icon">⚡</span>
                    Filters
                </button>
                <button class="btn btn-primary" id="addTaskBtn">
                    <span class="icon">+</span>
                    New Task
                </button>
            </div>
        </header>

        <!-- Filters Panel -->
        <div class="filters-panel" id="filtersPanel">
            <div class="filter-group">
                <label>Project</label>
                <select id="projectFilter">
                    <option value="">All Projects</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Priority</label>
                <select id="priorityFilter">
                    <option value="">All Priorities</option>
                    <option value="high">🔴 High</option>
                    <option value="medium">🟡 Medium</option>
                    <option value="low">🟢 Low</option>
                </select>
            </div>
            <button class="btn btn-ghost" id="manageProjectsBtn">
                <span class="icon">📁</span>
                Manage Projects
            </button>
        </div>

        <!-- Kanban Board -->
        <main class="board">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-dot todo"></span>
                        To Do
                    </div>
                    <span class="task-count" id="todoCount">0</span>
                </div>
                <div class="tasks-container" id="todoTasks"></div>
            </div>

            <div class="column" data-status="in_progress">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-dot in-progress"></span>
                        In Progress
                    </div>
                    <span class="task-count" id="inProgressCount">0</span>
                </div>
                <div class="tasks-container" id="inProgressTasks"></div>
            </div>

            <div class="column" data-status="done">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-dot done"></span>
                        Done
                    </div>
                    <span class="task-count" id="doneCount">0</span>
                </div>
                <div class="tasks-container" id="doneTasks"></div>
            </div>
        </main>

        <!-- Add Task Modal -->
        <div class="modal-overlay" id="taskModal">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">New Task</h2>
                    <button class="close-btn" id="closeTaskModal">×</button>
                </div>
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    <div class="form-group">
                        <label for="taskTitle">Title</label>
                        <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription" placeholder="Add more details..." rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority">
                                <option value="low">🟢 Low</option>
                                <option value="medium" selected>🟡 Medium</option>
                                <option value="high">🔴 High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskProject">Project</label>
                            <select id="taskProject">
                                <option value="">No Project</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="statusGroup" style="display: none;">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="todo">To Do</option>
                            <option value="in_progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-ghost" id="cancelTask">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Projects Modal -->
        <div class="modal-overlay" id="projectsModal">
            <div class="modal">
                <div class="modal-header">
                    <h2>Manage Projects</h2>
                    <button class="close-btn" id="closeProjectsModal">×</button>
                </div>
                <div class="projects-list" id="projectsList"></div>
                <form id="projectForm" class="new-project-form">
                    <input type="text" id="projectName" placeholder="New project name..." required>
                    <input type="color" id="projectColor" value="#6366f1">
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
